version: 2.1

jobs:
  m3-exact-candidate-proof:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    working_directory: ~/project
    environment:
      EXPECTED_PROOF_REPOSITORY: "Pacchifans69/linguagraph-m3-proof"
      EXPECTED_PROOF_BRANCH: "main"
      CANDIDATE_REPOSITORY_URL: "https://github.com/Pacchifans69/LinguaGraph.git"
      EXPECTED_CANDIDATE_REPOSITORY: "Pacchifans69/LinguaGraph"
      EXPECTED_CANDIDATE_BRANCH: "m3-word-token-segmentation-foundation"
      EXPECTED_CANDIDATE_SHA: "11385271c2e15f2331338bfd382627013fe38564"
      EXPECTED_CANDIDATE_TREE: "5fecde0c23d5f4c577096fca62fdc1fdae3d56e4"
      UV_PYTHON: "3.13"
      DATABASE_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres"
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres"
    steps:
      - checkout
      - run:
          name: "M3 — execute exact-candidate hosted proof"
          no_output_timeout: 20m
          command: |
            mkdir -p proof-artifacts
            set -o pipefail
            bash scripts/run-m3-proof.sh 2>&1 | tee proof-artifacts/command-transcript.log
      - store_artifacts:
          path: proof-artifacts
          destination: m3-external-proof

workflows:
  m3-exact-candidate-proof:
    jobs:
      - m3-exact-candidate-proof:
          filters:
            branches:
              only: main
